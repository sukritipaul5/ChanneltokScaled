# GPT-B continued training on ImageNet-100k (16K, constant LR)
# Resume from epoch 299, constant LR 1e-5

defaults:
  - base

gpt_model: "GPT-B"
global_batch_size: 256
epochs: 500  # 300 done + 200 more
lr: 0.00001  # 1e-5 constant
visualize_every: 5000
ckpt_every: 5000
wandb_name: "in100k-16k-gptb-continued-1e5"

# Resume
gpt_ckpt: "./results_imagenet100k_16k/000-GPT-B/checkpoints/latest.pt"
resume_same_folder: true

# No schedule — constant LR
use_lr_schedule: false
