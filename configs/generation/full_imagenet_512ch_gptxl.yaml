defaults: [base]

npz_path: "/path/to/your/imagenet_full_512ch"  # SET THIS — see handoff doc for how latents are being delivered
split: "train"

min_tokens: 512
max_tokens: 512
random_token_budget: false
fixed_token_budget: 512

vocab_size: 65536
bos_token_id: 65536
eos_token_id: 65537
pad_token_id: 65538
max_sequence_length: 514
target_seq_length: 514

gpt_model: "GPT-XL"
gpt_type: "c2i"
num_classes: 1000
cls_token_num: 0

# Starting point only — this was sized for 4x24GB A5000, not benchmarked on
# B100. Before committing to a long run: launch with max_train_steps=20,
# watch GPU memory headroom (the training loop logs this periodically),
# and adjust global_batch_size / gradient_accumulation_steps from there,
# exactly as was done to validate this on A5000.
# GPT-XL (775M in the original architecture family) has a larger tied
# output embedding and transformer trunk than GPT-L, so re-check its memory
# independently; a batch size that fits GPT-L may need to come down here.
global_batch_size: 512
gradient_accumulation_steps: 1

lr: 0.00025
use_lr_schedule: true
warmup_fraction: 0.1
ema: true
no_compile: false
mixed_precision: "bf16"
num_workers: 16

# 20 epochs is a starting estimate (matches the paper's ImageNet-100 AR run's
# total token-count-seen, scaled for 10x more images at 512 vs 256 tokens).
# Re-derive this after benchmarking real throughput on your hardware —
# see handoff doc for the extrapolation method used to validate this on A5000.
epochs: 20
max_train_steps: null
log_every: 100
ckpt_every: 5000
visualize_every: 5000

position_weight_type: "linear"
position_weight_alpha: 1.0

decoder_ckpt: "/cmlscratch/sukriti5/mask-git-juhu/ckpt_runpod/imagenet_bsq_large_twostage_gan_continued/last.ckpt"
decoder_config: "configs/exp/imagenet_bsq_large_continued.yaml"

wandb_enabled: true
wandb_project: "channeltok"
wandb_name: "full-imagenet-512ch-gptxl"
results_dir: "./results_full_imagenet_gptxl"
cloud_save_path: "./results_full_imagenet_gptxl/cloud"
no_local_save: false

gpt_ckpt: null
resume_same_folder: false
global_seed: 42
