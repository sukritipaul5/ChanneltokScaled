# Continued training config for ImageNet BSQ large model
# Loads generator/discriminator weights from the previous run and restarts
# training with a reduced learning rate schedule for fine-tuning stability.

defaults:
  - base

# Large model with transformer blocks (unchanged from original run)
model:
  name: "VQGANAutoencoder"
  latent_dim: 512

  use_latent_mask: true
  t_min: 0.002
  t_max: 1.0
  latent_mask_prob: 0.5

  quantizer: "BSQ"
  codebook_size: 65536
  entropy_loss_weight: 0.1
  commitment_loss_weight: 0.25
  diversity_gamma: 1.0

  quantizer_dim: 16
  num_codebooks: 1
  keep_num_codebooks_dim: false
  quantize_channels: true

  image_channels: 3
  input_resolution: 256
  target_spatial_size: 4

  encoder_channels: [192, 256, 384, 512, 640]
  encoder_attn_resolutions: [32, 16, 8]

  decoder_channels: [192, 256, 384, 512, 640]
  decoder_attn_resolutions: [8, 16, 32]

  use_flash_attn: true
  use_intermediate_attn: true
  use_final_attn: true
  flash_attn_heads: 8

# ImageNet WebDataset configuration
data:
  dataset: imagenet_wds
  hf_root: "/home/ubuntu/imagenet/datasets--timm--imagenet-1k-wds/snapshots/cdf403ce12f01022a0c36e584e588c0b9cebc4af/"
  train_glob: "imagenet1k-train-*.tar"
  val_glob: "imagenet1k-validation-*.tar"
  index_root: "/home/ubuntu/imagenet/wds_idx"
  train_index_subdir: "train"
  val_index_subdir: "val"

  #effective batch size has doubled. 
  #Earlier run was 32*16 gpus. now it is 32*32 gpus.

  batch_size: 32
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  shuffle: true
  img_size: 256
  val_resize: 256

# Training configuration
training:
  max_epochs: 50
  learning_rate: 2.5e-4  # 4x lower for fine-tuning
  discriminator_lr: 2.5e-5
  precision: "bf16-mixed"
  accelerator: "gpu"
  devices: -1
  strategy: "ddp"
  sync_batchnorm: true
  compile_model: true
  weight_decay: 0.01

  reset_train_epoch: 1

  lr_scheduler:
    type: "cosine_warmup"
    warmup_steps: 1000
    init_lr: 1e-6
    peak_lr: 2.5e-4
    min_lr: 5e-5

# Two-stage loss configuration remains the same
loss:
  loss_list: ["l1", "perceptual"]
  loss_weights: [0.25, 1.0]

  use_gan: true
  gan_start_epoch: 0
  gan_loss_weight: 0.1
  discriminator_channels: 64
  discriminator_layers: 3

# Logging
logging:
  name: "imagenet_bsq_large_twostage_gan_continued"
  project: "flextok"
  tags: ["imagenet", "bsq", "large", "transformer", "two-stage", "gan", "continued"]
  log_every_n_steps: 50
  log_viz_every: 2000
  use_wandb: true

# Output directory
output_dir: "./outputs/imagenet_bsq_large_twostage_gan_continued"

# Initialize from the previous run's final checkpoint
init_weights: "./outputs/imagenet_bsq_large_twostage_gan/checkpoints/last.ckpt"

# Resume settings for this continued run
resume: true
resume_from: null

# Mode
mode: "train"
